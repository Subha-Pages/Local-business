<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f4f7f6;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

div {
    background: white;
    padding: 2rem;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    text-align: center;
    max-width: 350px;
    width: 100%;
}

p {
    color: #333;
    font-size: 1.1rem;
    margin: 10px 0;
}

a {
    display: inline-block;
    margin-top: 15px;
    padding: 10px 20px;
    background-color: #007bff;
    color: white;
    text-decoration: none;
    border-radius: 5px;
    transition: background-color 0.3s ease;
}


a:hover {
    background-color: #0056b3;
}
    </style>
</head>
<body>
    <div class="contact-card">
        <p><strong>Phone:</strong> xxxxxxxx</p>
        <p><strong>Email:</strong> <a href="mailto:hello@example.com" style="background:none; color:#007bff; padding:0;">hello@example.com</a></p>
        <a href="https://www.google.com/maps/place/Ram+Thakur+Mandir/@22.5071664,88.2276652,19z/data=!4m6!3m5!1s0x3a027d897ceaad6d:0x82c62afa966e0ebd!8m2!3d22.5071661!4d88.2279906!16s%2Fg%2F11fsx718zd?entry=ttu&g_ep=EgoyMDI2MDMwNC4xIKXMDSoASAFQAw%3D%3D" target="_blank">View Location on Map</a>
    </div>
</body>
</html>
